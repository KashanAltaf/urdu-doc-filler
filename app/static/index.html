<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سبق کا منصوبہ — RAG</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="brand">
      <p class="brand-name">سبق کا منصوبہ</p>
      <p class="brand-sub">کتاب اپ لوڈ کریں + پرامپٹ لکھیں — دستاویز خود تیار ہو گی</p>
    </header>

    <main class="flow">
      <section class="step" id="ragSection">
        <h2>کتاب اور پرامپٹ</h2>
        <p class="hint">PDF یا DOCX کتاب اپ لوڈ کریں، پھر بتائیں کون سا سبق بنانا ہے</p>

        <div class="field">
          <label for="bookFile">کتاب (PDF / DOCX)</label>
          <input type="file" id="bookFile" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
        </div>

        <div class="field" style="margin-top: 0.85rem">
          <label for="promptBox">پرامپٹ</label>
          <textarea
            id="promptBox"
            class="paste paste-main"
            rows="8"
            spellcheck="false"
            placeholder="مثال: جماعت سوم کے لیے سبق «ہماری زمین» کا مکمل سبق منصوبہ بنائیں، ہفتہ دوسرا، سنگل پیریڈ 40 منٹ، SDG 4۔"
          ></textarea>
        </div>

        <div class="actions inline-actions">
          <button type="button" id="generateBtn" class="primary">دستاویز بنائیں اور ڈاؤن لوڈ کریں</button>
        </div>
        <p id="generateStatus" class="status" hidden></p>
        <p class="hint api-hint">مفت Gemini API: <code>GEMINI_API_KEY</code> فائل <code>.env</code> میں رکھیں</p>
      </section>
    </main>

    <footer class="foot">فونٹ: Jameel Noori Nastaleeq · ماڈل: Google Gemini (مفت)</footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
